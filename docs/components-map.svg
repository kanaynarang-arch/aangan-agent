<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1334 250" width="1334" height="250" role="img" aria-label="Components map: Trigger, Input, Context, Processing, AI, Output">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f675d"/></marker></defs>
<rect width="1334" height="250" fill="#faf8f5"/>
<rect x="24" y="22" width="196" height="48" rx="10" fill="#1f1b16"/>
<text class="label" x="122.0" y="53" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="600" fill="#faf8f5">Trigger</text>
<rect x="24" y="82" width="196" height="146" rx="10" fill="#ffffff" stroke="#e0d9ce" stroke-width="1.5"/>
<text class="cap" x="38" y="106" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">A caller dials the</text>
<text class="cap" x="38" y="128" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">studio number</text>
<text class="cap" x="38" y="150" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">Vani voice agent</text>
<text class="cap" x="38" y="172" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">answers, any hour</text>
<line x1="223" y1="46" x2="239" y2="46" stroke="#6f675d" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="242" y="22" width="196" height="48" rx="10" fill="#1f1b16"/>
<text class="label" x="340.0" y="53" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="600" fill="#faf8f5">Input</text>
<rect x="242" y="82" width="196" height="146" rx="10" fill="#ffffff" stroke="#e0d9ce" stroke-width="1.5"/>
<text class="cap" x="256" y="106" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">One question at a time:</text>
<text class="cap" x="256" y="128" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">name, phone, home or</text>
<text class="cap" x="256" y="150" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">office, place, size, scope,</text>
<text class="cap" x="256" y="172" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">timing, who decides,</text>
<text class="cap" x="256" y="194" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">preferred slot</text>
<line x1="441" y1="46" x2="457" y2="46" stroke="#6f675d" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="460" y="22" width="196" height="48" rx="10" fill="#1f1b16"/>
<text class="label" x="558.0" y="53" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="600" fill="#faf8f5">Context</text>
<rect x="460" y="82" width="196" height="146" rx="10" fill="#ffffff" stroke="#e0d9ce" stroke-width="1.5"/>
<text class="cap" x="474" y="106" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">Services and service area</text>
<text class="cap" x="474" y="128" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">Founder's 5-point rubric</text>
<text class="cap" x="474" y="150" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">The one pricing answer</text>
<text class="cap" x="474" y="172" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">Escalation rule</text>
<text class="cap" x="474" y="194" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">Caller history (Neon)</text>
<line x1="659" y1="46" x2="675" y2="46" stroke="#6f675d" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="678" y="22" width="196" height="48" rx="10" fill="#1f1b16"/>
<text class="label" x="776.0" y="53" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="600" fill="#faf8f5">Processing</text>
<rect x="678" y="82" width="196" height="146" rx="10" fill="#ffffff" stroke="#e0d9ce" stroke-width="1.5"/>
<text class="cap" x="692" y="106" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">Call ends: Vani sends</text>
<text class="cap" x="692" y="128" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">transcript, recording,</text>
<text class="cap" x="692" y="150" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">duration to a signed</text>
<text class="cap" x="692" y="172" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">webhook. Store the call,</text>
<text class="cap" x="692" y="194" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">turn it into fields</text>
<line x1="877" y1="46" x2="893" y2="46" stroke="#6f675d" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="896" y="22" width="196" height="48" rx="10" fill="#1f1b16"/>
<text class="label" x="994.0" y="53" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="600" fill="#faf8f5">AI</text>
<rect x="896" y="82" width="196" height="146" rx="10" fill="#ffffff" stroke="#e0d9ce" stroke-width="1.5"/>
<text class="cap" x="910" y="106" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">Gemini Flash scores</text>
<text class="cap" x="910" y="128" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">the call on the rubric:</text>
<text class="cap" x="910" y="150" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">tier, reasons, handoff</text>
<text class="cap" x="910" y="172" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">note. Code checks the</text>
<text class="cap" x="910" y="194" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">hard rules</text>
<line x1="1095" y1="46" x2="1111" y2="46" stroke="#6f675d" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="1114" y="22" width="196" height="48" rx="10" fill="#1f1b16"/>
<text class="label" x="1212.0" y="53" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="600" fill="#faf8f5">Output</text>
<rect x="1114" y="82" width="196" height="146" rx="10" fill="#ffffff" stroke="#e0d9ce" stroke-width="1.5"/>
<text class="cap" x="1128" y="106" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">Green: HubSpot, Cal.com,</text>
<text class="cap" x="1128" y="128" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">Telegram note</text>
<text class="cap" x="1128" y="150" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">Amber, Red: verify queue</text>
<text class="cap" x="1128" y="172" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">Escalate, dropped:</text>
<text class="cap" x="1128" y="194" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">Telegram alert</text>
<text class="cap" x="1128" y="216" font-family="system-ui,sans-serif" font-size="13.5" fill="#1f1b16">All: dashboard</text>
</svg>
